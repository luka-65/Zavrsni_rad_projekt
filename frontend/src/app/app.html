<div class="container">
  <h1>Crypto Trading Simulator</h1>

  <div class="tabs">
    <button
      [class.active]="activeTab === 'simulation'"
      (click)="activeTab = 'simulation'"
    >
      Simulacija
    </button>

    <button
      [class.active]="activeTab === 'results'"
      (click)="activeTab = 'results'"
      [disabled]="!result"
    >
      Rezultati
    </button>

    <button
      [class.active]="activeTab === 'compare'"
      (click)="activeTab = 'compare'"
    >
      Usporedba strategija
    </button>

    <button
      [class.active]="activeTab === 'history'"
      (click)="activeTab = 'history'"
    >
      Povijest i statistika
    </button>
  </div>

  @if (activeTab === 'simulation') {
    <app-simulation-form
      [symbolSearch]="symbolSearch"
      (symbolSearchChange)="symbolSearch = $event"

      [symbolResults]="symbolResults"

      [strategy]="strategy"
      (strategyChange)="strategy = $event"

      [interval]="interval"
      (intervalChange)="interval = $event"

      [initialBalance]="initialBalance"
      (initialBalanceChange)="initialBalance = $event"

      [shortWindow]="shortWindow"
      (shortWindowChange)="shortWindow = $event"

      [longWindow]="longWindow"
      (longWindowChange)="longWindow = $event"

      [rsiPeriod]="rsiPeriod"
      (rsiPeriodChange)="rsiPeriod = $event"

      [oversold]="oversold"
      (oversoldChange)="oversold = $event"

      [overbought]="overbought"
      (overboughtChange)="overbought = $event"

      [bollingerWindow]="bollingerWindow"
      (bollingerWindowChange)="bollingerWindow = $event"

      [numStd]="numStd"
      (numStdChange)="numStd = $event"

      [hasResult]="result !== null"

      (searchSymbolsEvent)="searchSymbols()"
      (selectSymbolEvent)="selectSymbol($event)"
      (runBacktestEvent)="runBacktest()"
      (compareStrategiesEvent)="compareStrategies()"
      (downloadPdfEvent)="downloadPdf()">
    </app-simulation-form>
  }

  @if (activeTab === 'results') {
    @if (result) {
      <button class="pdf-button" (click)="downloadPdf()">
        Preuzmi PDF izvještaj
      </button>

      <app-result-cards [result]="result"></app-result-cards>

      <app-trade-history [result]="result"></app-trade-history>

      <app-strategy-chart
        [strategy]="strategy"
        [result]="result">
      </app-strategy-chart>
    } @else {
      <p class="empty-message">
        Još nije pokrenuta nijedna simulacija.
      </p>
    }
  }

  @if (activeTab === 'compare') {
    <button class="action-button" (click)="compareStrategies()">
      Pokreni usporedbu strategija
    </button>

    <app-strategy-comparison
      [compareResults]="compareResults"
      [bestStrategy]="bestStrategy">
    </app-strategy-comparison>
  }

  @if (activeTab === 'history') {
    <app-dashboard-stats
      [dashboardStats]="dashboardStats">
    </app-dashboard-stats>

    <app-best-backtest
      [bestBacktest]="bestBacktest">
    </app-best-backtest>

    <app-simulation-history
      [simulations]="simulations"
      (selectSimulationEvent)="loadSimulationDetails($event)">
    </app-simulation-history>
  }
</div>
