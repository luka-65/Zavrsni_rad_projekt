@if (dashboardStats) {
  <div class="dashboard-cards">

    <div class="dashboard-card">
      <h3>Ukupno simulacija</h3>
      <p>{{ dashboardStats.total_simulations }}</p>
    </div>

    <div class="dashboard-card">
      <h3>Najčešća strategija</h3>
      <p>{{ formatStrategyName(dashboardStats.most_used_strategy) }}</p>
    </div>

    <div class="dashboard-card">
      <h3>Najbolji povrat</h3>
      <p [style.color]="dashboardStats.best_roi >= 0 ? '#22c55e' : '#ef4444'">
        {{ dashboardStats.best_roi }}%
      </p>
    </div>

    <div class="dashboard-card">
      <h3>Najtrgovaniji simbol</h3>
      <p>{{ dashboardStats.most_traded_symbol }}</p>
    </div>

  </div>
}
