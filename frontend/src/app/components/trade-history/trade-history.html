@if (result && result.result.trades.length > 0) {
  <h2>Popis transakcija</h2>

  <table>
    <thead>
      <tr>
        <th>Tip</th>
        <th>Cijena</th>
        <th>Dobit %</th>
      </tr>
    </thead>

    <tbody>
      @for (trade of result.result.trades; track $index) {
        <tr>
          <td>
            <span
              class="trade-badge"
              [class.buy]="isBuyTrade(trade)"
              [class.sell]="isSellTrade(trade)"
            >
              {{ formatTradeType(trade) }}
            </span>
          </td>
          <td>{{ trade.price }}</td>
          <td>{{ trade.profit_pct ?? '-' }}</td>
        </tr>
      }
    </tbody>
  </table>
}
